name: Product API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --username admin --password admin123 --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: |
          echo "PORT=3000" > .env
          echo "MONGO_URI=mongodb://admin:admin123@host.docker.internal:27017/productdb?authSource=admin" >> .env

      - name: Start Product API
        run: |
          nohup npm start > product-api.log 2>&1 &

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:3000/health; then
              echo "Product API is ready"
              exit 0
            fi
            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API failed to start"
          cat product-api.log
          exit 1

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            tranvanthai0412/product-api:latest
            tranvanthai0412/product-api:${{ github.sha }}

  deploy:
    name: Deploy to Local Docker Engine
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Deploy latest image
        run: |
          cd /Users/vthai/Documents/LTHDV/BTTH/product-api

          docker compose -f docker-compose-prod.yaml pull product-api

          docker compose -f docker-compose-prod.yaml up -d

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API healthcheck failed"

          docker compose -f /Users/vthai/Documents/LTHDV/BTTH/product-api/docker-compose-prod.yaml ps
          docker compose -f /Users/vthai/Documents/LTHDV/BTTH/product-api/docker-compose-prod.yaml logs --tail=100 product-api

          exit 1
