services:
  product-api:
    image: product-api:local
    container_name: product-api
    restart: unless-stopped

    environment:
      PORT: 3000
      MONGO_URI: mongodb://admin:admin123@host.docker.internal:27017/productdb?authSource=admin

    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", 'node -e "require(''http'').get(''http://127.0.0.1:3000/health'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
